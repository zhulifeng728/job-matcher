<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>AI 求职助手</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 340px;
    font: 14px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #0f172a;
    background: #fff;
  }

  /* 头部 */
  .head {
    padding: 16px 18px;
    background: linear-gradient(135deg, #5B8DEF, #3669EC);
    color: #fff;
  }
  .head .row { display: flex; align-items: center; gap: 9px; }
  .head .logo {
    width: 30px; height: 30px; border-radius: 9px; flex: none;
    background: rgba(255,255,255,.22);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 13px;
  }
  .head h1 { font-size: 15px; font-weight: 600; }
  .head .sub { font-size: 11.5px; opacity: .82; margin-top: 8px; }

  /* 状态条 */
  .status {
    display: flex; align-items: center; gap: 7px;
    padding: 9px 18px; font-size: 12.5px;
    background: #f8fafc; border-bottom: 1px solid #eef2f9;
  }
  .status .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .status .dot.ok { background: #22c55e; }
  .status .dot.warn { background: #f59e0b; }
  .status .dot.err { background: #ef4444; }
  .status .txt { color: #475569; flex: 1; }

  /* 表单 */
  .body { padding: 16px 18px; }
  .label {
    display: block; font-size: 12px; font-weight: 600;
    color: #64748b; margin-bottom: 6px;
  }
  .label .opt { font-weight: 400; color: #94a3b8; }
  input {
    width: 100%; padding: 9px 11px; font-size: 13px;
    border: 1px solid #dbe3f0; border-radius: 8px;
    font-family: inherit; color: #0f172a;
    transition: border-color .15s, box-shadow .15s;
  }
  input:focus {
    outline: none; border-color: #3669EC;
    box-shadow: 0 0 0 3px rgba(54,105,236,.12);
  }
  input::placeholder { color: #b6c2d4; }

  .field { margin-bottom: 14px; }

  .btn {
    width: 100%; padding: 10px 0; font-size: 13.5px; font-weight: 500;
    border-radius: 9px; border: 1px solid #dbe3f0; background: #fff;
    color: #334155; cursor: pointer; font-family: inherit;
    transition: all .15s;
  }
  .btn:hover { border-color: #3669EC; color: #3669EC; }
  .btn.primary {
    background: linear-gradient(135deg, #5B8DEF, #3669EC);
    color: #fff; border-color: transparent;
  }
  .btn.primary:hover { filter: brightness(1.06); color: #fff; }
  .btn:disabled { opacity: .55; cursor: not-allowed; }

  .row2 { display: flex; gap: 8px; }

  .msg {
    font-size: 12.5px; padding: 9px 12px; border-radius: 8px;
    margin-bottom: 14px; line-height: 1.5;
  }
  .msg.ok { background: #dcfce7; color: #15803d; }
  .msg.err { background: #fee2e2; color: #b91c1c; }
  .msg.info { background: #eff6ff; color: #1d4ed8; }
  .msg.hidden { display: none; }

  .help {
    font-size: 11.5px; color: #94a3b8; line-height: 1.65;
    margin-top: 6px;
  }
  .help a { color: #3669EC; text-decoration: none; }
  .help a:hover { text-decoration: underline; }

  .divider { height: 1px; background: #eef2f9; margin: 16px 0; }

  .sites {
    font-size: 11.5px; color: #94a3b8; line-height: 1.7;
  }
  .sites b { color: #64748b; font-weight: 500; }

  .footer {
    padding: 10px 18px 14px; font-size: 11px; color: #b6c2d4;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="head">
    <div class="row">
      <div class="logo">AI</div>
      <h1>AI 求职助手</h1>
    </div>
    <div class="sub">在招聘网站看岗位时，一键算匹配度</div>
  </div>

  <div class="status">
    <span class="dot warn" id="dot"></span>
    <span class="txt" id="statusText">未连接</span>
  </div>

  <div class="body">
    <div class="msg hidden" id="msg"></div>

    <div class="field">
      <label class="label" for="server">服务器地址</label>
      <input type="text" id="server" placeholder="http://150.158.49.37" spellcheck="false">
    </div>

    <div class="field">
      <label class="label" for="token">
        访问令牌
        <span class="opt">（在网站「设置」里生成）</span>
      </label>
      <input type="password" id="token" placeholder="jme_..." spellcheck="false">
      <div class="help">
        令牌只存在这个浏览器里，不会上传。网站账号 → 设置 → 生成扩展令牌。
      </div>
    </div>

    <div class="row2">
      <button class="btn primary" id="save">保存并连接</button>
      <button class="btn" id="test" style="flex:0 0 92px">测试</button>
    </div>

    <div class="divider"></div>

    <div class="sites">
      <b>已支持</b>：BOSS 直聘、智联招聘、猎聘、拉勾、前程无忧、LinkedIn、牛客<br>
      <b>用法</b>：打开任意岗位详情页，点右下角蓝色按钮。识别不到时可用「手动选择区域」。
    </div>
  </div>

  <div class="footer">令牌不落库明文 · 只存哈希</div>

  <script src="popup.js"></script>
</body>
</html>
