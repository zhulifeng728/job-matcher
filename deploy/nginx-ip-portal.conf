# 服务器门户 + 子路径应用（本机实际使用的配置）
# 部署位置：/data/parking/nginx/conf.d/job-matcher.conf（nginx 容器挂载自宿主机）
#
# 结构：
#   /                  → 项目门户（静态页，无需应用在线）
#   /job-matcher/      → AI 求职助手主实例（:7788）
#   /demo/             → 免登录演示实例（:7790）
#   /api/              → 兼容旧版扩展：根路径 API 仍指向主实例
#
# 门户文件放在 nginx 容器内 /usr/share/nginx/html/portal/index.html
# （宿主机副本：/opt/portal/index.html，容器重建后需要 docker cp 回去）

limit_req_zone $binary_remote_addr zone=jobmatcher:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=jobmatcherdemo:10m rate=60r/m;

server {
    listen 80;
    server_name 150.158.49.37;

    client_max_body_size 8m;

    access_log /var/log/nginx/job-matcher.access.log;
    error_log  /var/log/nginx/job-matcher.error.log;

    # ── 门户首页 ──
    location = / {
        root /usr/share/nginx/html;
        try_files /portal/index.html =404;
        add_header Cache-Control "no-cache";
    }

    location /portal/ {
        alias /usr/share/nginx/html/portal/;
        index index.html;
    }

    # ── 健康检查 ──
    location = /api/health {
        access_log off;
        proxy_pass http://172.21.0.1:7788;
        proxy_set_header Host $host;
    }

    # ── 旧版扩展兼容（服务器地址填 http://IP 的仍可用）──
    location /api/ {
        limit_req zone=jobmatcher burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://172.21.0.1:7788;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── 公开 demo ──
    location = /demo {
        return 301 /demo/;
    }

    location /demo/ {
        limit_req zone=jobmatcherdemo burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://172.21.0.1:7790/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # ── 主应用（子路径）──
    # 注意末尾斜杠：nginx 会剥掉 /job-matcher 前缀再转发，
    # 应用内部仍以 / 为根，所以它的相对路径（api/、vendor/、img/）自动带上前缀。
    location = /job-matcher {
        return 301 /job-matcher/;
    }

    location /job-matcher/ {
        limit_req zone=jobmatcher burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://172.21.0.1:7788/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    location / {
        return 302 /;
    }
}
