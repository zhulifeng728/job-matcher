<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>职镜 · 照着 JD 改简历，不猜 HR 想什么</title>
<meta name="description" content="职镜 —— 粘贴一份岗位描述，30 秒得到匹配度、要改哪些经历、缺什么技能要补多久。">
<style>
  :root {
    --brand: #3669EC; --brand-2: #5B8DEF; --ink: #0F172A; --ink-2: #475569;
    --ink-3: #64748B; --line: #E2E8F0; --line-2: #CBD5E1;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --grad: linear-gradient(135deg, #5B8DEF, #3669EC);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; color: var(--ink); background: #fff;
    font: 15px/1.65 -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; min-height: 100vh;
  }

  /* 背景：极淡网格 + 顶部光晕 */
  .bg {
    position: fixed; inset: 0; z-index: -1;
    background:
      radial-gradient(900px 420px at 50% -12%, rgba(54,105,236,.10), transparent 70%),
      linear-gradient(#fff, #FBFDFF);
  }
  .bg::after {
    content: ''; position: absolute; inset: 0;
    background-image:
      linear-gradient(to right, rgba(15,23,42,.035) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(15,23,42,.035) 1px, transparent 1px);
    background-size: 56px 56px;
    mask-image: radial-gradient(720px 460px at 50% 22%, #000 0%, transparent 78%);
    -webkit-mask-image: radial-gradient(720px 460px at 50% 22%, #000 0%, transparent 78%);
  }

  main {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 72px 24px 40px; text-align: center;
  }
  .inner { max-width: 660px; width: 100%; }

  .mark {
    width: 64px; height: 64px; border-radius: 18px; margin: 0 auto 26px;
    background: var(--grad); color: #fff; display: grid; place-items: center;
    font-size: 28px; font-weight: 700; letter-spacing: -.02em;
    box-shadow: 0 14px 34px rgba(54,105,236,.32), inset 0 1px 0 rgba(255,255,255,.28);
  }

  h1 {
    font-size: 52px; line-height: 1.1; letter-spacing: -.035em;
    margin: 0 0 8px; font-weight: 800; color: #16233C;
  }
  .py { font-family: var(--mono); font-size: 12.5px; color: #94A3B8; letter-spacing: .26em; margin-bottom: 22px; }
  .tagline { font-size: 18px; line-height: 1.65; color: var(--ink-2); margin: 0 0 34px; }
  .tagline b { color: var(--ink); font-weight: 600; }

  .cta { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-bottom: 16px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    height: 48px; padding: 0 26px; border-radius: 11px; border: 1px solid transparent;
    font-size: 15px; font-weight: 600; text-decoration: none; cursor: pointer;
    transition: transform .15s, box-shadow .15s, background .15s, border-color .15s, color .15s;
  }
  .btn:focus-visible { outline: none; box-shadow: 0 0 0 4px rgba(54,105,236,.22); }
  .btn-primary { background: var(--grad); color: #fff; box-shadow: 0 8px 22px rgba(54,105,236,.28); }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 12px 28px rgba(54,105,236,.34); }
  .btn-ghost { background: #fff; color: var(--ink-2); border-color: var(--line-2); }
  .btn-ghost:hover { color: var(--brand); border-color: #B9CCF5; background: #F7FAFF; }

  .hint { font-size: 13px; color: var(--ink-3); margin-bottom: 40px; }

  .status {
    display: inline-flex; align-items: center; gap: 16px; flex-wrap: wrap;
    justify-content: center; padding: 9px 18px;
    border: 1px solid var(--line); border-radius: 999px; background: rgba(255,255,255,.72);
    backdrop-filter: blur(6px);
    font-family: var(--mono); font-size: 11.5px; color: var(--ink-3);
  }
  .status .s { display: inline-flex; align-items: center; gap: 6px; }
  .status i { width: 6px; height: 6px; border-radius: 50%; background: #22C55E; box-shadow: 0 0 7px rgba(34,197,94,.7); display: block; }
  .status .s.demo i { background: #F59E0B; box-shadow: 0 0 7px rgba(245,158,11,.6); }
  .status .sep { color: var(--line-2); }

  footer { padding: 20px 24px 26px; border-top: 1px solid var(--line); color: var(--ink-3); font-size: 12.5px; }
  .f-inner {
    max-width: 800px; margin: 0 auto; display: flex;
    justify-content: space-between; gap: 14px; flex-wrap: wrap; align-items: center;
  }
  footer a { color: var(--ink-2); text-decoration: none; }
  footer a:hover { color: var(--brand); }
  .f-meta { font-family: var(--mono); font-size: 11.5px; color: #94A3B8; }

  @media (max-width: 640px) {
    main { padding: 52px 20px 32px; }
    h1 { font-size: 38px; }
    .tagline { font-size: 16px; }
  }
</style>
</head>
<body>
<div class="bg"></div>

<main>
  <div class="inner">
    <div class="mark">职</div>

    <h1>职镜</h1>
    <div class="py">Z H I J I N G</div>

    <p class="tagline">
      照着 JD 改简历，<b>不猜 HR 想什么</b>。<br>
      粘贴一份岗位描述，30 秒得到匹配度、要改哪些经历、缺什么技能要补多久。
    </p>

    <div class="cta">
      <a class="btn btn-primary" href="/job-matcher/">进入工具</a>
      <a class="btn btn-ghost" href="/demo/">免登录看演示</a>
    </div>
    <div class="hint">无需信用卡 · 简历只存在这台服务器上</div>

    <div class="status">
      <span class="s"><i></i>主站运行中</span>
      <span class="sep">·</span>
      <span class="s demo"><i></i>演示实例</span>
      <span class="sep">·</span>
      <span class="s"><i></i>PostgreSQL 16</span>
    </div>
  </div>
</main>

<footer>
  <div class="f-inner">
    <span>单项目服务器 · nginx 反向代理 · 零第三方依赖</span>
    <span class="f-meta">
      <a href="/job-matcher/">/job-matcher/</a> ·
      <a href="/demo/">/demo/</a> ·
      <a href="/job-matcher/download/job-matcher-extension.zip">扩展</a> ·
      <a href="https://github.com/zhulifeng728/job-matcher" target="_blank" rel="noopener">GitHub</a>
    </span>
  </div>
</footer>

</body>
</html>
